<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Your Profile - GLOOBA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="form-container">
        <h2>Set Up Your Profile</h2>
        <p class="subtext">This is optional. You can always do this later.</p>

        <form action="#" method="post" enctype="multipart/form-data">
            <div class="form-group profile-pic-group">
                <label for="profile_pic">Profile Picture</label>
                <div class="profile-pic-upload">
                    <img src="https://via.placeholder.com/100" alt="Profile Picture" id="pic_preview">
                    <input type="file" id="profile_pic" name="profile_pic" accept="image/*">
                    <label for="profile_pic" class="btn-upload">Upload Photo</label>
                </div>
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="3" placeholder="Tell us about yourself..."></textarea>
            </div>

            <div class="form-group">
                <label>Choose Your Interests</label>
                <div class="interests-container">
                    <div class="interest-tag">Sports</div>
                    <div class="interest-tag">Tech</div>
                    <div class="interest-tag">Music</div>
                    <div class="interest-tag">Lifestyle</div>
                    <div class="interest-tag">Art</div>
                    <div class="interest-tag">Gaming</div>
                    <div class="interest-tag">Travel</div>
                    <div class="interest-tag">Food</div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save & Continue</button>
            <a href="#" class="skip-link">Skip for now</a>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
