{% extends "base.html" %}

{% block title %}Forgot Password - GLOOBA{% endblock %}

{% block content %}
    <div class="form-container">
        <h2>Forgot Your Password?</h2>
        <p class="subtext">Enter your email and we'll send you instructions to reset your password.</p>
        <form action="{{ url_for('forgot_password') }}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary">Send Reset Instructions</button>
        </form>
    </div>
{% endblock %}
