{% extends "base.html" %}

{% block title %}Create Post - GLOOBA{% endblock %}

{% block content %}
    <div class="composer-container form-container">
        <h2>Create Post</h2>
        <form action="{{ url_for('composer') }}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <textarea name="content" class="composer-textarea" placeholder="Globalize your thought..." rows="5"></textarea>
            </div>
            <div class="form-group">
                <label for="media">Upload Photo or Video</label>
                <input type="file" id="media" name="media" class="media-input" accept="image/*,video/*">
            </div>
            <button type="submit" class="btn btn-primary">Post</button>
        </form>
    </div>
{% endblock %}
